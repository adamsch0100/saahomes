<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in · ListLogic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/saas/ll.css">
<style>
body {
  min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
  background: radial-gradient(900px 500px at 80% -10%, #1a5f9e33, transparent 60%),
              radial-gradient(700px 400px at 10% 110%, #c9a22722, transparent 55%),
              linear-gradient(180deg, #0b1220 0%, #101a2e 100%);
}
.auth-card {
  background: var(--card); border-radius: 22px; padding: 36px 32px;
  width: 100%; max-width: 440px; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.55);
}
.auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; font-size: 1.1rem; margin-bottom: 22px; }
.auth-brand img { height: 42px; width: auto; display: block; }
h1 { font-family: 'Fraunces', serif; font-size: 1.7rem; letter-spacing: -0.02em; margin-bottom: 6px; }
.sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 16px; }
.hint-box {
  background: #f7f4ee; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 13px 15px; font-size: 0.84rem; color: var(--muted); margin-bottom: 18px; line-height: 1.5;
}
button.btn { width: 100%; padding: 13px; font-size: 0.95rem; }
.auth-links { margin-top: 20px; font-size: 0.82rem; display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.auth-links a { color: var(--muted); text-decoration: none; }
.auth-links a:hover { color: var(--ink); }
.dev-link { word-break: break-all; font-size: 0.78rem; margin-top: 10px; }
.forgot { margin-top: 12px; font-size: 0.84rem; text-align: center; }
.field[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="auth-card">
  <a href="/saas/" class="auth-brand" style="text-decoration:none;color:inherit">
    <img src="/saas/listlogic-logo.png" alt="ListLogic">
  </a>
  <div class="ll-signed-out" id="signedOut" hidden>You’re signed out. Sign back in below — it only takes a moment.</div>
  <h1>Welcome back</h1>
  <p class="sub" id="authSub">Sign in with your email and password.</p>
  <div class="hint-box">
    New here? <a href="/saas/signup.html" id="signupLink">Create an account</a>
    · or <a href="/demo">try the sample listing</a> with no signup.
  </div>

  <form id="authForm">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <div class="pw-wrap">
        <input id="password" type="password" autocomplete="current-password" required>
        <button type="button" class="pw-show" data-for="password" aria-label="Show password">Show</button>
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="authSubmit">Sign in</button>
  </form>
  <p class="forgot"><button type="button" class="ll-linkbtn" id="forgotBtn">Forgot your password?</button></p>

  <p class="status" id="status"></p>
  <p class="dev-link" id="devLink" style="display:none"></p>
  <div class="auth-links">
    <a href="/saas/">Home</a>
    <a href="/saas/pricing.html">Pricing</a>
    <a href="/saas/faq.html">FAQ</a>
  </div>
</div>
<script src="/saas/auth-ui.js"></script>
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next') || '';
const invite = (params.get('invite') || '').trim();
const form = document.getElementById('authForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const submitBtn = document.getElementById('authSubmit');
const forgotBtn = document.getElementById('forgotBtn');
const statusEl = document.getElementById('status');
const devEl = document.getElementById('devLink');

if (invite) document.getElementById('signupLink').href = '/saas/signup.html?invite=' + encodeURIComponent(invite);

// Already signed in? Go straight in.
fetch('/api/auth-status', { credentials: 'same-origin' })
  .then((r) => r.json())
  .then((d) => {
    if (d && d.authenticated) {
      const dest = next && next.startsWith('/') ? next : (d.user && d.user.role === 'admin' ? '/saas/admin.html' : '/saas/app.html');
      location.replace(dest);
    }
  })
  .catch(() => {});

if (params.get('signed_out')) document.getElementById('signedOut').hidden = false;
const prefill = (params.get('email') || '').trim() || (window.llLastEmail ? window.llLastEmail() : '');
if (prefill) emailInput.value = prefill;
setTimeout(() => (emailInput.value ? passwordInput : emailInput).focus(), 0);

function setStatus(msg, kind) {
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
  statusEl.textContent = msg || '';
}
function showDevLink(url) {
  if (!url) { devEl.style.display = 'none'; return; }
  devEl.style.display = 'block';
  devEl.innerHTML = 'Dev link: <a href="' + url + '">' + url + '</a>';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = emailInput.value.trim();
  submitBtn.disabled = true;
  submitBtn.textContent = 'Signing in…';
  setStatus('');
  showDevLink('');
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email, password: passwordInput.value, next, invite }),
    });
    const payload = await res.json().catch(() => ({}));
    const detail = payload.detail;
    if (res.status === 409 && detail && detail.reason === 'needs_password') {
      window.llRememberEmail(email);
      setStatus(detail.message, 'ok');
      showDevLink(detail.dev_url);
      return;
    }
    if (!res.ok) throw new Error(typeof detail === 'string' ? detail : 'Invalid email or password');
    window.llRememberEmail(email);
    location.href = payload.next || (payload.user?.role === 'admin' ? '/saas/admin.html' : '/saas/app.html');
  } catch (err) {
    setStatus(String(err.message || err), 'error');
    passwordInput.select();
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Sign in';
  }
});

forgotBtn.addEventListener('click', async () => {
  const email = emailInput.value.trim();
  if (!email) {
    setStatus('Enter your email above, then tap “Forgot your password?” again.', 'error');
    emailInput.focus();
    return;
  }
  forgotBtn.disabled = true;
  setStatus('Sending…');
  showDevLink('');
  try {
    const res = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ email, next }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Could not send the reset email');
    window.llRememberEmail(email);
    setStatus(data.message, 'ok');
    showDevLink(data.dev_url);
  } catch (err) {
    setStatus(String(err.message || err), 'error');
  } finally {
    setTimeout(() => { forgotBtn.disabled = false; }, 4000);
  }
});
</script>
<script src="/saas/analytics.js"></script>
<script src="/saas/utm.js"></script>
<script src="/saas/assistant.js"></script>
</body>
</html>
