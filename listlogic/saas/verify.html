<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — ListLogic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/saas/ll.css">
<style>
body {
  min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
  background: radial-gradient(900px 500px at 80% -10%, #1a5f9e33, transparent 60%),
              radial-gradient(700px 400px at 10% 110%, #c9a22722, transparent 55%),
              linear-gradient(180deg, #0b1220 0%, #101a2e 100%);
}
.auth-card {
  background: var(--card); border-radius: 22px; padding: 36px 32px;
  width: 100%; max-width: 440px; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.55);
  text-align: center;
}
.auth-brand { display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; font-size: 1.1rem; margin-bottom: 22px; }
.auth-brand img { height: 42px; width: auto; display: block; }
h1 { font-family: 'Fraunces', serif; font-size: 1.5rem; letter-spacing: -0.02em; margin-bottom: 8px; }
.sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 18px; }
.auth-links { margin-top: 20px; font-size: 0.82rem; }
.auth-links a { color: var(--muted); }
</style>
</head>
<body>
<div class="auth-card">
  <a href="/saas/" class="auth-brand" style="text-decoration:none;color:inherit">
    <img src="/saas/listlogic-logo.png" alt="ListLogic">
  </a>
  <h1>ListLogic now uses a password</h1>
  <p class="sub">Email sign-in links have been retired. Sign in with your email and password — if you haven’t set one yet, the sign-in page will email you a link to choose it.</p>
  <p><a class="btn btn-primary" href="/saas/login.html">Go to sign in</a></p>
</div>
<script>setTimeout(function () { location.replace('/saas/login.html'); }, 2500);</script>
</body>
</html>
