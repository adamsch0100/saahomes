<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up your profile — ListLogic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/saas/ll.css">
<style>
body {
  min-height: 100vh; display: grid; place-items: center; padding: 32px 20px;
  background: radial-gradient(900px 500px at 80% -10%, #1a5f9e33, transparent 60%),
              radial-gradient(700px 400px at 10% 110%, #c9a22722, transparent 55%),
              linear-gradient(180deg, #0b1220 0%, #101a2e 100%);
}
.auth-card {
  background: var(--card); border-radius: 22px; padding: 36px 32px;
  width: 100%; max-width: 520px; box-shadow: 0 40px 90px -30px rgba(0,0,0,0.55);
}
.auth-brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -0.02em; font-size: 1.1rem; margin-bottom: 22px; }
.auth-brand img { height: 42px; width: auto; display: block; }
h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; letter-spacing: -0.02em; margin-bottom: 6px; }
.sub { color: var(--muted); font-size: 0.92rem; margin-bottom: 20px; }
.section-label {
  font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--navy); margin: 18px 0 10px;
}
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }
.color-field input[type="color"] { padding: 4px; height: 44px; cursor: pointer; }
button.btn { width: 100%; padding: 13px; font-size: 0.95rem; margin-top: 8px; }
.hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="auth-card">
  <a href="/saas/" class="auth-brand" style="text-decoration:none;color:inherit">
    <img src="/saas/listlogic-logo.png" alt="ListLogic">
  </a>
  <h1>Make reports yours</h1>
  <p class="sub">This branding fills every presentation, print leave-behind, and flipbook. Set a password so you can sign in without email next time.</p>

  <form id="form">
    <div class="section-label">Password</div>
    <div class="field">
      <label for="password">Create a password <span style="font-weight:400;text-transform:none">(8+ characters)</span></label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>
    </div>
    <p class="hint">You’ll still be able to use a magic link anytime.</p>

    <div class="section-label">Agent profile</div>
    <div class="field">
      <label for="name">Full name</label>
      <input id="name" required autocomplete="name">
    </div>
    <div class="row2">
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" autocomplete="tel">
      </div>
      <div class="field">
        <label for="email">Email on reports</label>
        <input id="email" type="email" readonly>
      </div>
    </div>
    <div class="field">
      <label for="brokerage">Brokerage</label>
      <input id="brokerage" required placeholder="Coldwell Banker Realty" autocomplete="organization">
    </div>

    <div class="section-label">Brand colors</div>
    <div class="row2">
      <div class="field color-field">
        <label for="brandPrimary">Primary</label>
        <input type="color" id="brandPrimary" value="#0c3c6e">
      </div>
      <div class="field color-field">
        <label for="brandAccent">Accent</label>
        <input type="color" id="brandAccent" value="#1a5f9e">
      </div>
    </div>
    <div class="field">
      <label for="logo">Logo <span style="font-weight:400;text-transform:none">(optional)</span></label>
      <input type="file" id="logo" accept=".png,.jpg,.jpeg,.webp,.svg">
    </div>

    <button type="submit" class="btn btn-gold">Save &amp; continue</button>
  </form>
  <p class="status" id="status"></p>
</div>
<script>
const params = new URLSearchParams(location.search);
const next = params.get('next') || '/saas/app.html';

(async () => {
  try {
    const res = await fetch('/api/auth-status');
    const data = await res.json();
    if (data.required && !data.authenticated) {
      location.href = '/saas/login.html?next=' + encodeURIComponent('/saas/onboarding.html');
      return;
    }
    const u = data.user || {};
    document.getElementById('name').value = u.name || '';
    document.getElementById('phone').value = u.phone || '';
    document.getElementById('email').value = u.email || '';
    document.getElementById('brokerage').value = u.brokerage || '';
    document.getElementById('brandPrimary').value = u.brand_primary || '#0c3c6e';
    document.getElementById('brandAccent').value = u.brand_accent || '#1a5f9e';
    if (u.has_password) {
      const pw = document.getElementById('password');
      pw.required = false;
      pw.placeholder = 'Leave blank to keep current password';
    }
  } catch (e) {}
})();

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const status = document.getElementById('status');
  status.className = 'status';
  status.textContent = 'Saving…';
  const fd = new FormData();
  fd.set('name', document.getElementById('name').value.trim());
  fd.set('phone', document.getElementById('phone').value.trim());
  fd.set('brokerage', document.getElementById('brokerage').value.trim());
  fd.set('brand_primary', document.getElementById('brandPrimary').value);
  fd.set('brand_accent', document.getElementById('brandAccent').value);
  const pw = document.getElementById('password').value;
  if (pw) fd.set('password', pw);
  const logo = document.getElementById('logo').files[0];
  if (logo) fd.set('logo', logo);
  try {
    if (document.getElementById('password').required && pw.length < 8) {
      throw new Error('Password must be at least 8 characters');
    }
    const res = await fetch('/api/profile', { method: 'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Could not save profile');
    location.href = next.startsWith('/') ? next : '/saas/app.html';
  } catch (err) {
    status.className = 'status error';
    status.textContent = String(err.message || err);
  }
});
</script>
<script src="/saas/assistant.js"></script>
</body>
</html>
