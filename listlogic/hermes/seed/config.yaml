model:
  # Preferred daily: deepseek-v4-flash (requires OpenCode Go China-hosting opt-in).
  # Until Adam opts in at OpenCode console, use mimo-v2.5 as daily standby.
  # After opt-in: set default back to deepseek-v4-flash (bootstrap honors this file).
  default: mimo-v2.5
  provider: opencode-go

providers:
  opencode-go:
    base_url: https://opencode.ai/zen/go/v1

# Model routing (Adam lock):
# - deepseek-v4-flash — main daily / monitoring / harvest / most chat
# - deepseek-v4-pro — next step (content drafts, competitor deep dives, delegation)
# - kimi-k3 — super-intelligence only (hard strategy, high-stakes decisions)
#
# Cron jobs must pin provider+model explicitly (see automation-registry.md).

auxiliary:
  compression:
    provider: opencode-go
    model: deepseek-v4-flash
  web_extract:
    provider: opencode-go
    model: deepseek-v4-flash

delegation:
  provider: opencode-go
  model: deepseek-v4-pro
  max_concurrent_children: 5
  max_spawn_depth: 2

gateway:
  working_directory: /opt/data/workspace/listlogic
  platforms:
    telegram:
      enabled: true

cron:
  enabled: true

browser:
  cloud_provider: browserbase
  inactivity_timeout: 300

tools:
  toolsets:
    - web
    - terminal
    - files
    - browser
