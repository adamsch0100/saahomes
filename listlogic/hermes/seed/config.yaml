model:
  default: kimi-k2.6
  provider: opencode-go

providers:
  opencode-go:
    base_url: https://opencode.ai/zen/go/v1

auxiliary:
  compression:
    provider: opencode-go
    model: deepseek-v4-flash
  web_extract:
    provider: opencode-go
    model: deepseek-v4-flash

delegation:
  provider: opencode-go
  model: deepseek-v4-pro
  max_concurrent_children: 5
  max_spawn_depth: 2

gateway:
  working_directory: /opt/data/workspace/listlogic
  platforms:
    telegram:
      enabled: true

cron:
  enabled: true

browser:
  cloud_provider: browserbase
  inactivity_timeout: 300

tools:
  toolsets:
    - web
    - terminal
    - files
    - browser
